<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        background:
          radial-gradient(1100px 700px at 88% -12%, hsl(230 58% 44% / 0.18), transparent 60%),
          linear-gradient(150deg, hsl(150 62% 96%) 0%, hsl(224 100% 97%) 52%, hsl(42 100% 96%) 100%);
        color: hsl(192 46% 10%);
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(hsl(190 24% 70% / 0.16) 1px, transparent 1px),
          linear-gradient(90deg, hsl(190 24% 70% / 0.16) 1px, transparent 1px);
        background-size: 46px 46px;
        -webkit-mask-image: linear-gradient(to bottom, black, transparent 78%);
      }
      .wrap { position: relative; padding: 84px 90px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
      .top { display: flex; align-items: center; gap: 22px; }
      .mark {
        width: 92px; height: 92px; border-radius: 24px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, hsl(157 64% 30%), hsl(230 58% 44%));
        color: #fff; font-size: 38px; font-weight: 800; letter-spacing: -1px;
        box-shadow: 0 20px 50px hsl(154 58% 38% / 0.35);
      }
      .brandname { font-size: 30px; font-weight: 800; color: hsl(190 30% 22%); }
      h1 { font-size: 86px; line-height: 1.02; font-weight: 800; letter-spacing: -2px; max-width: 16ch;
        background: linear-gradient(135deg, hsl(192 46% 10%) 0%, hsl(160 58% 24%) 55%, hsl(230 58% 44%) 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .sub { margin-top: 26px; font-size: 33px; font-weight: 600; color: hsl(190 18% 32%); max-width: 30ch; }
      .cards { display: flex; gap: 24px; }
      .card { padding: 24px 30px; border-radius: 20px; background: hsl(0 0% 100% / 0.82);
        border: 1px solid hsl(190 24% 80%); box-shadow: 0 18px 45px hsl(192 46% 10% / 0.1); }
      .card .lbl { font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
      .card .val { font-size: 58px; font-weight: 800; line-height: 1; margin-top: 12px; color: hsl(192 46% 10%); }
      .gpa .lbl { color: hsl(157 64% 30%); }
      .cgpa .lbl { color: hsl(28 82% 38%); }
      .tag { font-size: 24px; font-weight: 700; color: hsl(190 18% 38%); align-self: center; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap">
      <div class="top">
        <div class="mark">4.0</div>
        <div class="brandname">GPA Calculator Pakistan</div>
      </div>
      <div>
        <h1>Semester GPA &amp; CGPA in seconds</h1>
        <div class="sub">Accurate scales for NUST, FAST, COMSATS, GIKI, IIUI, PIEAS, Air, UET &amp; IST.</div>
      </div>
      <div class="cards">
        <div class="card gpa"><div class="lbl">Semester GPA</div><div class="val">3.75</div></div>
        <div class="card cgpa"><div class="lbl">Updated CGPA</div><div class="val">3.25</div></div>
        <div class="tag">Free &middot; No signup &middot; Runs in your browser</div>
      </div>
    </div>
  </body>
</html>
