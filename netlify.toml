[build]
  publish = "."

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/site.config.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOYMENT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/gpa-calculator-pakistan"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/gpa-calculator-pakistan/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/gpa-calculator-pakistan/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/cgpa-calculator-pakistan"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/cgpa-calculator-pakistan/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/cgpa-calculator-pakistan/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
